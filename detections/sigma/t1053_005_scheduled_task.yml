title: Scheduled Task Created via schtasks
id: 7f3c2a10-4b1e-4d6a-9f2b-1a2b3c4d5e03
status: experimental
description: Detects creation of scheduled tasks from the command line, often used for persistence.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: Angel Medina
date: 2026-10-28
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/create'
  condition: selection
falsepositives:
  - Software installers and IT management scripts
level: medium
